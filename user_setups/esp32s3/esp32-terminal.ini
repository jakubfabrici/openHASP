;***************************************************;
;     Elecrow ESP32-S3 Terminal                     ;
;           - ili9488 TFT SPI 4-WIRE or 16-bit RGB  ;
;           - ft6236 touch controller               ;
;***************************************************;

[esp32-terminal]
extends = arduino_esp32s3_v2
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

build_flags =
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}

;region -- TFT_eSPI build options ------------------------
    ;-D USER_SETUP_LOADED=1
    -D LGFX_USE_V1=1
    -D ILI9488_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_RST=-1      ;// Reset pin (could connect to RST pin)
    -D TFT_BCKL=46     ; Configurable via web UI (e.g. 2 for D4)
    -D HASP_USE_LGFX_TOUCH=1
    -D TOUCH_DRIVER=0x6336
    -D TOUCH_IRQ=-1
    -D I2C_TOUCH_PORT=0
    -D I2C_TOUCH_ADDRESS=0x38
    -D I2C_TOUCH_FREQUENCY=400000
    -D SPI_TOUCH_FREQUENCY=0
;endregion

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${lovyangfx.lib_deps}

[esp32-terminal-spi]
extends = esp32-terminal

build_flags =
    -D HASP_MODEL="ESP32-Terminal SPI"
    ${esp32-terminal.build_flags}
    -D TFT_ROTATION=0 ; 0=0, 1=90, 2=180 or 3=270 degree
    -D TFT_MISO=14
    -D TFT_MOSI=13
    -D TFT_SCLK=12
    -D TFT_CS=03       ;// Chip select control pin
    -D TFT_DC=42       ;// Data Command control pin
    -D SPI_FREQUENCY=60000000
    -D SPI_READ_FREQUENCY=16000000
    -D TFT_DMA_CHANNEL=1
    -D TOUCH_SDA=02
    -D TOUCH_SCL=01

[esp32-terminal-rgb]
extends = esp32-terminal

build_flags =
    -D HASP_MODEL="ESP32-Terminal RGB"
    ${esp32-terminal.build_flags}
    -D TFT_ROTATION=3 ; landscape, same orientation as the Elecrow factory firmware

    ; ILI9488 on the 16-bit parallel (DBI type B) bus of the LCD_CAM peripheral
    -D TFT_WR=18
    -D TFT_RD=48
    -D TFT_DC=45
    -D TFT_D0=47
    -D TFT_D1=21
    -D TFT_D2=14
    -D TFT_D3=13
    -D TFT_D4=12
    -D TFT_D5=11
    -D TFT_D6=10
    -D TFT_D7=9
    -D TFT_D8=3
    -D TFT_D9=8
    -D TFT_D10=16
    -D TFT_D11=15
    -D TFT_D12=7
    -D TFT_D13=6
    -D TFT_D14=5
    -D TFT_D15=4
    ; ILI9488 datasheet: write cycle min. 40 ns => max. 25 MHz. 24 MHz is an exact
    ; 240 MHz / 10 divider. Higher values are capped by LovyanGFX at 50 MHz with a
    ; fractional divider, which violates the panel timing (random pixel noise).
    -D SPI_FREQUENCY=24000000
    -D LV_VDB_SIZE=61440 ; draw buffer = 1/5 of the 480x320 frame (64 lines)
    -D TOUCH_SDA=38
    -D TOUCH_SCL=39

    ; Other on-board peripherals, not used by the display driver:
    ;   GPIO 20 passive buzzer (MLT-8530) -> GPIO output type "Buzzer"
    ;   GPIO 0  BOOT button, GPIO 19 A-port (3.3 V), GPIO 40 D-port (5 V level shifted)
    ;   GPIO 43/44 UART port = the same UART0 as the USB console (5 V level shifted)
    ;   TF card slot (SPI, not supported by the firmware):
    -D SD_MOSI=2
    -D SD_MISO=41
    -D SD_SCK=42
    -D SD_CS=1
    ;   Battery: BAT+ through a 100k/100k divider (1:2) on GPIO 17 = ADC2 channel 6.
    ;   The voltage is published in the statusupdate message and discovered by Home Assistant.
    -D BAT_ADC=17
    -D BAT_ADC_DIVIDER=2

[env:esp32-terminal-spi_16MB]
extends = esp32-terminal-spi, flash_16mb

[env:esp32-terminal-rgb_16MB]
extends = esp32-terminal-rgb, flash_16mb
